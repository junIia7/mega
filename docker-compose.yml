version: '3.8'

services:
  github-app:
    build: .
    container_name: github-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      # Монтируем .env файл (опционально, если хотите редактировать без пересборки)
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Добавлены необходимые зависимости для CI/CD
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:alpine
    container_name: github-app-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:13-alpine
    container_name: github-app-postgres
    environment:
      POSTGRES_DB: github_app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: