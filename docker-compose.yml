version: '3.8'

services:
  github-app:
    build: .
    container_name: github-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      # Монтируем .env файл (опционально, если хотите редактировать без пересборки)
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Добавлен healthcheck для проверки состояния приложения
    # Интервал проверки - 30 секунд, таймаут - 10 секунд
    # 3 попытки перед тем как пометить контейнер как unhealthy
    # 40 секунд на старт приложения

  # Добавлен сервис для проверки качества кода
  code-quality:
    image: python:3.9-slim
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: /app/scripts/quality_check.sh
    depends_on:
      github-app:
        condition: service_healthy